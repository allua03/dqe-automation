[pytest]
testpaths = .
python_files = test_*.py
pythonpath = ..
addopts = -ra
markers =
	parquet_data: source-to-Parquet data quality checks
	smoke: fast dataset availability check
	example: framework usage examples
	facility_name_min_time_spent_per_visit_date: dataset checks
	facility_type_avg_time_spent_per_visit_date: dataset checks
	dataset_patient_sum_treatment_cost_per_facility_type: dataset checks
