[pytest]
markers =
    parquet_data: tests validating Parquet datasets produced by the data_dev pipeline
    smoke: lightweight checks that the dataset is readable and not empty
    example: sample tests demonstrating framework usage; excluded from -m parquet_data
    facility_name_min_time_spent_per_visit_date: checks for the facility_name_min_time_spent_per_visit_date dataset
    facility_type_avg_time_spent_per_visit_date: checks for the facility_type_avg_time_spent_per_visit_date dataset
    patient_sum_treatment_cost_per_facility_type: checks for the patient_sum_treatment_cost_per_facility_type dataset
python_files = test_*.py
